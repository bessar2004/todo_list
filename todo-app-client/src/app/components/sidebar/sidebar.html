<aside class="sidebar" [class.mobile-open]="isOpen">
  <!--Logo-->

  <div class="sidebar-brand">
    <img class="brand-logo" src="/your-plan-logo.svg" alt="" aria-hidden="true" width="36" height="36" />

    <span class="brand-name"> your plan </span>

    <button
      type="button"
      class="mobile-close"
      [attr.aria-label]="language.translate('menu.close')"
      (click)="close()"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- NAVIGATION -->

  <nav class="sidebar-nav">
    @for (item of MenuItems; track item.route) {
      <button
        type="button"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="close()"
      >
        <i [class]="item.icon"></i>

        <span>
          {{ language.translate(item.labelKey) }}
        </span>
      </button>
    }

    <button type="button" class="nav-item" (click)="logout()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>

      <span>
        {{ language.translate('nav.logout') }}
      </span>
    </button>
  </nav>

  <!-- KULLANICI -->
  <div class="sidebar-user">
    <div class="user-avatar" aria-hidden="true">{{ auth.avatarInitial() }}</div>
    <div class="user-info">
      @if (auth.currentUser(); as user) {
        <strong>{{ user.fullName }}</strong>
        <span>{{ user.email }}</span>
      } @else {
        <strong>{{ language.translate('user.name') }}</strong>
      }
    </div>
  </div>
</aside>
