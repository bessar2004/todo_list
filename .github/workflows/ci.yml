name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test TodoApp.Api.Tests/TodoApp.Api.Tests.csproj

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todo-app-client/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
